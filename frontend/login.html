<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TaskMaster Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100 py-5">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5">
                <div class="card auth-card border-0 shadow-lg">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="auth-icon-wrapper mb-3">
                                <i class="bi bi-check2-square fs-1 text-primary"></i>
                            </div>
                            <h3 class="fw-bold text-dark">Welcome Back</h3>
                            <p class="text-muted small">Manage your day with precision & speed</p>
                        </div>
                        
                        <div id="alert-msg" class="alert alert-danger d-none rounded-3 py-2 px-3 small mb-3" role="alert"></div>

                        <form id="login-form">
                            <div class="mb-3">
                                <label class="form-label text-secondary fw-semibold small">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                                    <input type="email" id="email" class="form-control border-start-0" placeholder="name@company.com" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-secondary fw-semibold small">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" id="password" class="form-control border-start-0" placeholder="••••••••" required>
                                </div>
                            </div>
                            <button type="submit" id="login-btn" class="btn btn-primary w-100 py-2-5 fw-bold btn-hover-effect">
                                <span>Sign In</span>
                                <i class="bi bi-arrow-right ms-2"></i>
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="text-muted small mb-0">Don't have an account? <a href="register.html" class="fw-bold text-primary text-decoration-none">Create free account</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
