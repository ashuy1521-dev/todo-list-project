<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TaskMaster Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dashboard-body">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg border-bottom fixed-top shadow-sm-custom">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold text-primary fs-5" href="#">
                <i class="bi bi-check2-circle fs-3 me-2"></i> TaskMaster Pro
            </a>
            <div class="d-flex align-items-center gap-3">
                <!-- Dark Mode Toggle Button -->
                <button id="theme-toggle" class="theme-btn border rounded-pill px-3 py-1 fw-semibold small d-flex align-items-center gap-1">
                    <span id="theme-icon">🌙</span> Dark Mode
                </button>
                <div class="user-pill d-flex align-items-center px-3 py-1 rounded-pill border">
                    <i class="bi bi-person-circle text-secondary me-2"></i>
                    <span id="user-name" class="fw-semibold small">Loading...</span>
                </div>
                <button id="logout-btn" class="btn btn-outline-danger btn-sm rounded-pill px-3 fw-semibold">
                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container page-content">
        <!-- Toast Alert Container -->
        <div id="toast-notification" class="toast-custom d-none">
            <i id="toast-icon" class="bi me-2"></i>
            <span id="toast-msg"></span>
        </div>

        <!-- Task Stats Counters -->
        <div class="row g-3 mb-4">
            <div class="col-12 col-sm-6 col-md">
                <div class="card stat-card clickable-stat border-0 shadow-sm p-3" onclick="filterByCard('all')">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <span class="text-muted small fw-semibold">Total Tasks</span>
                            <h3 id="stat-total" class="fw-bold mb-0">0</h3>
                        </div>
                        <div class="stat-icon bg-primary-soft text-primary"><i class="bi bi-list-task fs-4"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md">
                <div class="card stat-card clickable-stat border-0 shadow-sm p-3" onclick="filterByCard('pending')">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <span class="text-muted small fw-semibold">Pending</span>
                            <h3 id="stat-pending" class="fw-bold mb-0 text-warning">0</h3>
                        </div>
                        <div class="stat-icon bg-warning-soft text-warning"><i class="bi bi-clock-history fs-4"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md">
                <div class="card stat-card clickable-stat border-0 shadow-sm p-3" onclick="filterByCard('completed')">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <span class="text-muted small fw-semibold">Completed</span>
                            <h3 id="stat-completed" class="fw-bold mb-0 text-success">0</h3>
                        </div>
                        <div class="stat-icon bg-success-soft text-success"><i class="bi bi-check-circle fs-4"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md">
                <div class="card stat-card clickable-stat border-0 shadow-sm p-3" onclick="filterByCard('high')">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <span class="text-muted small fw-semibold">High Priority</span>
                            <h3 id="stat-high" class="fw-bold mb-0 text-danger">0</h3>
                        </div>
                        <div class="stat-icon bg-danger-soft text-danger"><i class="bi bi-exclamation-triangle fs-4"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md">
                <div class="card stat-card clickable-stat border-0 shadow-sm p-3" onclick="filterByCard('overdue')">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <span class="text-muted small fw-semibold">Overdue</span>
                            <h3 id="stat-overdue" class="fw-bold mb-0 text-orange">0</h3>
                        </div>
                        <div class="stat-icon bg-orange-soft text-orange"><i class="bi bi-calendar-x fs-4"></i></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Task Input Form -->
        <div class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body p-4">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h5 id="form-title" class="fw-bold mb-0"><i class="bi bi-plus-circle text-primary me-2"></i>Add New Task</h5>
                    <button type="button" id="cancel-edit-btn" class="btn btn-light btn-sm text-secondary fw-semibold rounded-pill px-3 d-none">
                        <i class="bi bi-x-circle me-1"></i> Cancel Editing
                    </button>
                </div>
                <form id="task-form">
                    <input type="hidden" id="task-id">
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Task Title <span class="text-danger">*</span></label>
                        <input type="text" id="task-title" class="form-control" placeholder="What needs to be done?" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Description</label>
                        <textarea id="task-desc" class="form-control" rows="2" placeholder="Add additional details or notes..."></textarea>
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label text-secondary small fw-semibold">Category</label>
                            <select id="task-category" class="form-select">
                                <option value="Personal">Personal</option>
                                <option value="Work">Work</option>
                                <option value="Study">Study</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-secondary small fw-semibold">Priority</label>
                            <select id="task-priority" class="form-select">
                                <option value="Low">Low</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-secondary small fw-semibold">Due Date</label>
                            <input type="date" id="task-date" class="form-control">
                        </div>
                    </div>
                    <div class="d-flex justify-content-end">
                        <button type="submit" id="save-task-btn" class="btn btn-primary fw-bold px-4 rounded-3 btn-hover-effect">
                            <i class="bi bi-plus-lg me-1"></i> <span>Add Task</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Filter Controls -->
        <div class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body p-3">
                <div class="row g-2 align-items-center">
                    <div class="col-lg-5 col-md-12">
                        <div class="input-group">
                            <span class="input-group-text border-end-0 text-muted"><i class="bi bi-search"></i></span>
                            <input type="text" id="search-input" class="form-control border-start-0" placeholder="Search tasks by title...">
                        </div>
                    </div>
                    <div class="col-lg-2 col-md-4 col-6">
                        <select id="filter-status" class="form-select">
                            <option value="All">All Status</option>
                            <option value="Pending">Pending</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                    <div class="col-lg-2 col-md-4 col-6">
                        <select id="filter-priority" class="form-select">
                            <option value="All">All Priority</option>
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                    <div class="col-lg-3 col-md-4 col-12">
                        <select id="filter-category" class="form-select">
                            <option value="All">All Categories</option>
                            <option value="Personal">Personal</option>
                            <option value="Work">Work</option>
                            <option value="Study">Study</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Task List Container -->
        <div class="d-flex align-items-center justify-content-between mb-3">
            <h5 class="fw-bold mb-0">Your Tasks</h5>
            <span id="task-count-badge" class="badge bg-secondary rounded-pill">0 Tasks</span>
        </div>
        
        <div id="task-list"></div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
